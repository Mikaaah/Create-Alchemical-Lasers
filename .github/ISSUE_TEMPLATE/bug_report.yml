name: Bug report
description: Report a reproducible Alchemical Laser issue
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, NeoForge, Create, Alchemical Lasers and relevant optional mods
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Setup and reproduction
      description: Include recipe JSON/KubeJS, catalyst, stack counts, RPM and redstone state where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Attach a crash report or relevant latest.log section. Remove private information.
