name: Build and server regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scripting: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resources
        run: |
          pip install -r tools/requirements-dev.txt
          python tools/verify_resources.py
      - name: Check Java formatting
        run: |
          curl --fail --location --output "$RUNNER_TEMP/formatter.jar" https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.28.0/google-java-format-1.28.0-all-deps.jar
          find src -name '*.java' -print0 | xargs -0 java -jar "$RUNNER_TEMP/formatter.jar" --dry-run --set-exit-if-changed
      - name: Install scripting test mods
        if: matrix.scripting
        run: |
          mkdir -p run/mods run/kubejs/server_scripts
          curl --fail --location --retry 2 --output run/mods/kubejs.jar https://maven.latvian.dev/releases/dev/latvian/mods/kubejs-neoforge/2101.7.2-build.379/kubejs-neoforge-2101.7.2-build.379.jar
          curl --fail --location --retry 2 --output run/mods/rhino.jar https://maven.latvian.dev/releases/dev/latvian/mods/rhino/2101.2.7-build.81/rhino-2101.2.7-build.81.jar
          curl --fail --location --retry 2 --output run/mods/kubejs-create.jar https://maven.latvian.dev/releases/dev/latvian/mods/kubejs-create-neoforge/2101.3.1-build.18/kubejs-create-neoforge-2101.3.1-build.18.jar
          cp tools/test-kubejs/server_scripts/laser_smoke.js run/kubejs/server_scripts/
      - name: Build and run GameTests
        run: ./gradlew build compileGameTestJava runGameTestServer
      - name: Verify default recipe switches
        if: matrix.scripting
        run: |
          python -c "from pathlib import Path; p=Path('run/config/alchemicallaser-common.toml'); p.write_text(p.read_text().replace('= true', '= false'))"
          ./gradlew runConfigTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-test-results-scripting-${{ matrix.scripting }}
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/latest.log
